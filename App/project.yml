name: VibeCoder
options:
  bundleIdPrefix: tools.vibecoder
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Bump LastUpgradeCheck so Xcode stops nagging "Update to recommended settings".
attributes:
  # Match current Xcode so Issues doesn’t nag "Update to recommended settings".
  LastUpgradeCheck: "1640"
  LastSwiftUpdateCheck: "1640"

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""           # fill in for signed builds
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "VibeCoder"
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "5"
    # Xcode recommended project settings (post-upgrade checklist)
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_MODULE_VERIFIER: YES

packages:
  AgentCore:
    path: ..
  # No remote deps — Sparkle (updates) and Sentry (crash reports) removed.
  # AgentCore is the only package the app needs to run.

targets:
  VibeCoder:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "VibeCoder.entitlements"
          - "Info.plist"
          - "Tests"
          # Vendor/ is not Swift sources (if reintroduced).
          - "Vendor"
    info:
      path: Info.plist
      properties:
        CFBundleName: "VibeCoder"
        CFBundleDisplayName: "VibeCoder"
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "5"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Max Køngerskov. All rights reserved."
        LSApplicationCategoryType: "public.app-category.developer-tools"
    entitlements:
      path: VibeCoder.entitlements
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: "App/VibeCoder.entitlements"
        ENABLE_TESTABILITY: YES
        PRODUCT_MODULE_NAME: VibeCoderApp
    dependencies:
      - package: AgentCore
        product: AgentCore
      - package: AgentCore
        product: MLXBackend

  VibeCoderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: VibeCoder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tools.vibecoder.VibeCoderTests
        PRODUCT_MODULE_NAME: VibeCoderTests
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VibeCoder.app/Contents/MacOS/VibeCoder"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  VibeCoder:
    build:
      targets:
        VibeCoder: all
        VibeCoderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VibeCoderTests
